<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book Feedback Form</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f7f9fa; }
    .form-box { max-width: 400px; background: white; padding: 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .field-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background-color: #0056b3; }
    .success-alert { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="form-box">
  <h2>Book Feedback Application</h2>

  <div th:if="${message}" class="success-alert" th:text="${message}"></div>

  <form th:action="@{/saveFeedback}" th:object="${feedbackObj}" method="post">

    <div class="field-group">
      <label for="name">Name:</label>
      <input type="text" id="name" th:field="*{name}" required placeholder="Your full name" />
    </div>

    <div class="field-group">
      <label for="bookName">Book Name:</label>
      <input type="text" id="bookName" th:field="*{bookName}" required placeholder="Title of the book" />
    </div>

    <div class="field-group">
      <label for="feedback">Feedback:</label>
      <textarea id="feedback" th:field="*{feedback}" rows="4" required placeholder="Write your review here..."></textarea>
    </div>

    <button type="submit">Submit</button>
  </form>
</div>

</body>
</html>
